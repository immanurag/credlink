server:
  port: ${PORT:8080}

spring:
  application:
    name: credlink-backend

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/credlink;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:sa}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: ${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

credlink:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:30}
    mode: ${OTP_MODE:mock}   # mock | live  (mock logs the OTP to server console instead of sending an email)

  mail:
    # Sender ("From") address for real OTP emails. Falls back to SMTP_USERNAME if not set.
    from: ${SMTP_FROM:}

  nlp:
    mode: ${LLM_MODE:mock}   # mock | live
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://openrouter.ai/api/v1/chat/completions}
    model: ${LLM_MODEL:openai/gpt-4o-mini}

  voice:
    mode: ${VOICE_MODE:mock}  # mock | sarvam | web_speech
    sarvam-api-key: ${SARVAM_API_KEY:}
    sarvam-api-url: ${SARVAM_API_URL:https://api.sarvam.ai/speech-to-text}
    sarvam-model: ${SARVAM_MODEL:saaras:v3}

  notification:
    mode: ${NOTIFY_MODE:mock}  # mock | live
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      sms-from: ${TWILIO_SMS_FROM:}
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:}

  cors:
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    com.credlink: INFO
